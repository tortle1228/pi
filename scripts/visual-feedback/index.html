<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 검토</title>
<style>
:root { font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:#242629; background:#fff; accent-color:#242629; }
* { box-sizing:border-box; }
body { margin:0; }
button,input,textarea { font:inherit; }
button { cursor:pointer; border:0; border-radius:5px; padding:8px 14px; background:none; color:inherit; white-space:nowrap; }
button:disabled { opacity:.4; cursor:default; }
button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid #ad4c16; outline-offset:3px; }
::selection { background:#dce4fa; color:#152547; }
h1 { font-size:18px; font-weight:600; letter-spacing:-.025em; line-height:1.4; margin:0; }
form { margin:0; }
fieldset { border:0; padding:0; margin:0; min-width:0; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 20px; min-height:62px; border-bottom:1px solid #e7e8e6; }
.actions { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.primary { background:#242629; color:#fff; }
.secondary { color:#60656d; }
.workspace { display:grid; grid-template-columns:minmax(0,1fr) 192px; gap:16px; padding:16px; height:calc(100dvh - 94px); min-height:420px; }
.workspace.annotate { grid-template-columns:minmax(0,1fr) 292px; }
.preview { min-height:0; min-width:0; display:flex; align-items:center; justify-content:center; padding:16px; border-radius:6px; background:#eff0ee; overflow:hidden; }
.stage { position:relative; flex:none; line-height:0; }
.stage img { width:100%; height:100%; display:block; }
canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
.choices,.comments { min-width:0; overflow:auto; scrollbar-color:#c2c4bf transparent; scrollbar-width:thin; }
.choice { display:block; margin:0 1px 12px; padding:8px; border:1px solid #dedfdb; border-radius:6px; cursor:pointer; }
.choice:hover { border-color:#8d918a; }
.choice:has(input:checked) { border-color:#242629; outline:1px solid #242629; }
.choice img { display:block; width:100%; height:112px; object-fit:contain; background:#f1f2ef; border-radius:2px; }
.caption { display:flex; align-items:center; gap:8px; margin-top:9px; font-size:13px; font-weight:550; }
.caption input { margin:0; width:15px; height:15px; }
.comments label { display:block; font-size:13px; font-weight:600; margin:0 0 8px; }
textarea { display:block; width:100%; min-height:90px; padding:10px; border:1px solid #d4d7d2; border-radius:5px; resize:vertical; color:inherit; background:#fff; }
textarea::placeholder { color:#666c73; }
.tools { display:flex; gap:4px; margin-bottom:18px; }
.tools button { border:1px solid #dedfdb; font-size:12px; padding:6px 10px; }
.editor-actions { display:flex; justify-content:flex-end; gap:4px; margin:8px 0 16px; }
.editor-actions button { padding:6px 10px; font-size:12px; }
#regions { list-style:none; padding:0; margin:0 0 22px; }
#regions li { border-top:1px solid #e7e8e6; padding:10px 0; font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
#regions li button { float:right; padding:2px 4px; font-size:12px; color:#60656d; }
#status { margin:0; padding:0 20px 8px; font-size:12px; color:#555d66; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
[hidden] { display:none!important; }
@media(max-width:700px) {
 .topbar { padding:10px 12px; gap:8px; flex-wrap:wrap; } h1 { font-size:16px; } button { padding:8px 10px; }
 .workspace,.workspace.annotate { grid-template-columns:1fr; grid-template-rows:minmax(240px,1fr) auto; padding:12px; gap:12px; height:auto; min-height:calc(100dvh - 110px); }
 .workspace.report,.workspace.choose { min-height:0; grid-template-rows:auto auto; }
 .preview { height:clamp(280px,52dvh,520px); padding:12px; }
 .choices { display:flex; gap:12px; overflow-x:auto; padding:2px; }
 .choice { margin:0; flex:0 0 144px; } .choice img { height:88px; }
 .comments { overflow:visible; } .tools { margin-bottom:12px; }
}
</style>
<script src="/client.js" defer></script>
</head>
<body>
<form id="feedback">
<fieldset id="controls" disabled>
<legend class="sr-only">시안 검토</legend>
<header class="topbar">
<h1 id="question">화면을 불러오는 중입니다</h1>
<div class="actions">
<button id="request-edit" class="primary" type="button" hidden>수정 요청</button>
<button id="back" class="secondary" type="button" hidden>시안 다시 선택</button>
<button id="cancel" class="secondary" type="button">취소</button>
<button id="submit" class="primary" type="submit" disabled>다음</button>
</div>
</header>
<main id="workspace" class="workspace">
<div id="preview" class="preview">
<div id="current-stage" class="stage" hidden>
<img id="current-image" alt="현재 화면">
<canvas id="overlay" hidden aria-label="드래그로 수정 영역 지정. 키보드 사용자는 전체 화면 버튼을 사용하세요."></canvas>
</div>
</div>
<div id="choices" class="choices" role="radiogroup" aria-label="시안 선택" hidden></div>
<aside id="comments" class="comments" hidden>
<div class="tools"><button id="whole" type="button">전체 화면</button><button id="clear-selection" type="button" disabled>선택 해제</button></div>
<label for="region-note">선택 영역 수정</label>
<textarea id="region-note" maxlength="2000" placeholder="영역을 드래그하고 수정할 내용을 입력하세요"></textarea>
<div class="editor-actions"><button id="discard" type="button">작성 취소</button><button id="add" class="primary" type="button" disabled>추가</button></div>
<ol id="regions"></ol>
<label for="note">전체 의견</label>
<textarea id="note" maxlength="8000" placeholder="선택 사항"></textarea>
</aside>
</main>
</fieldset>
</form>
<p id="status" role="status" aria-live="polite"></p>
</body>
</html>
